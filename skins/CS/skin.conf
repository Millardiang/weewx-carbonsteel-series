###############################################################################
# weewx-carbonsteel-series: live gauges skin for WeeWX 5                      #
#                                                                             #
# Realtime values come from realtime.json, written on every LOOP packet by    #
# the user.carbonsteelseries.CarbonSteelSeriesRealtime service. This skin     #
# generates the page plus history.json (last 24 h) and calendar.json (one     #
# year of daily summaries) each report cycle.                                 #
###############################################################################

SKIN_NAME = CarbonSteelSeries
SKIN_VERSION = 1.0.0

[CarbonSteelSeries]
    # Page title. Leave blank to use the station location from weewx.conf.
    title = ""

    # Where the page fetches realtime data from, relative to the page. Change
    # this if realtime.json is served from somewhere else.
    realtime_url = realtime.json

    # How often the page polls realtime.json, in seconds.
    poll_interval = 2.5

    # Default gauge face and bezel. "auto" follows the page theme:
    #   light theme -> chrome bezel, classic beige face
    #   dark theme  -> black-metal bezel, carbon fibre face
    # Visitors can change both from the buttons in the page header.
    # face:  auto, beige, white, anthracite, carbon
    # bezel: auto, chrome, black
    face = auto
    bezel = auto

    # Outlook in the header ticker: open-meteo (free, no key, fetched by the
    # visitor's browser using the station latitude/longitude), or none.
    forecast = open-meteo
    forecast_days = 3

    # Show a 24-hour sparkline under each gauge (click it for a detail chart).
    sparklines = true

    # Show the "Year at a glance" calendar heat-map below the gauges.
    calendar = true

    # Show the station as offline when realtime.json is older than this (s).
    stale_after = 120

    # Gauges to show, in order. Gauges for sensors that report nothing are
    # hidden automatically. Available: temp, dew, hum, baro, wind, dir, rose,
    # rain, rainrate, uv, solar, cloudbase
    gauges = temp, dew, hum, baro, wind, dir, rose, rain, rainrate, uv, solar, cloudbase

    # Hours of archive history for sparklines and detail charts.
    history_hours = 24

    # Days shown on the calendar heat-map.
    calendar_days = 366

    # Default gauge scales. The page expands a scale automatically if today's
    # values fall outside it. Give min, max for each unit you might display.
    [[ranges]]
        degree_C = -10, 40
        degree_F = 10, 100
        hPa = 970, 1050
        mbar = 970, 1050
        inHg = 28.6, 31.0
        kPa = 97, 105
        mmHg = 730, 790
        km_per_hour = 0, 60
        mile_per_hour = 0, 40
        meter_per_second = 0, 20
        knot = 0, 40
        mm = 0, 10
        cm = 0, 1
        inch = 0, 0.5
        mm_per_hour = 0, 10
        cm_per_hour = 0, 1
        inch_per_hour = 0, 0.5
        watt_per_meter_squared = 0, 1200
        uv_index = 0, 12
        meter = 0, 3000
        foot = 0, 10000

[Units]
    # realtime.json and the history files use your station's display units,
    # as set by unit_system in [StdReport] [[Defaults]] of weewx.conf. To use
    # different units for these gauges only, add to weewx.conf:
    #
    #   [StdReport]
    #       [[CarbonSteelSeries]]
    #           [[[Units]]]
    #               [[[[Groups]]]]
    #                   group_speed = km_per_hour
    #
    # Visitors can also switch units in the browser (settings menu).

    [[StringFormats]]
        degree_C = %.1f
        degree_F = %.1f
        degree_compass = %.0f
        foot = %.0f
        hPa = %.1f
        mbar = %.1f
        inHg = %.3f
        kPa = %.2f
        mmHg = %.1f
        inch = %.2f
        inch_per_hour = %.2f
        mm = %.1f
        mm_per_hour = %.1f
        cm = %.2f
        cm_per_hour = %.2f
        km_per_hour = %.1f
        km_per_hour2 = %.1f
        mile_per_hour = %.1f
        mile_per_hour2 = %.1f
        meter_per_second = %.1f
        meter_per_second2 = %.1f
        knot = %.1f
        knot2 = %.1f
        meter = %.0f
        percent = %.0f
        uv_index = %.1f
        watt_per_meter_squared = %.0f

[CheetahGenerator]
    search_list_extensions = user.carbonsteelseries.CarbonSteelSeriesHistory
    encoding = utf8

    [[ToDate]]
        [[[index]]]
            template = index.html.tmpl
        [[[history]]]
            template = history.json.tmpl
        [[[calendar]]]
            template = calendar.json.tmpl
        # For gauges shown inside another skin (see the Belchertown page)
        [[[config]]]
            template = config.js.tmpl
        [[[embed]]]
            template = css/embed.css.tmpl

[CopyGenerator]
    copy_always = js/*, css/*.css, fonts/*, favicon.svg

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
