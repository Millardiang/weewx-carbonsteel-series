###############################################################################
# weewx-carbonsteel-series: gauges page for the Seasons skin                  #
#                                                                             #
# Generates one page, carbonsteel-gauges.html, in the Seasons report's folder. #
# It uses the Seasons stylesheet, script and title bar, and takes its gauges, #
# live data and page options from the CarbonSteelSeries report (the CS        #
# folder), so the two always match. Nothing belonging to Seasons is changed.  #
###############################################################################

SKIN_NAME = CarbonSteelSeries-Seasons
SKIN_VERSION = 1.0.1

[CarbonSteelSeries]
    # Report whose page options (face, bezel, sparklines, calendar, ...) and
    # data files (realtime.json, history.json, calendar.json) this page uses.
    data_report = CarbonSteelSeries

    # Seasons has a light design only, so the page stays light: chrome bezel
    # and beige face (or the face and bezel set for the CS page).
    theme = light

    # No CarbonSteel header on this page: no outlook ticker, update counter,
    # or face, bezel and units switches. Seasons has none of these.
    controls = false

    # Take the title-bar wording, language and display units from the Seasons
    # report, so the page reads and measures like the other Seasons pages.
    # Seasons is only read, never changed.
    host_skin = Seasons

    # Any other option from skins/CS/skin.conf can be given here to differ
    # from the main gauges page, e.g.  gauges = temp, hum, baro, wind, rain

[DisplayOptions]
    # As in the Seasons skin: show the RSS link and the NOAA report pickers in
    # the title bar. Set these to match your Seasons settings.
    show_rss = True
    show_reports = True

[CheetahGenerator]
    search_list_extensions = user.carbonsteelseries.CarbonSteelSeriesHistory
    encoding = utf8

    [[ToDate]]
        [[[carbonsteel_gauges]]]
            template = carbonsteel-gauges.html.tmpl

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator
